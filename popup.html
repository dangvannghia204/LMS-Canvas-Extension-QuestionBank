<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <style>
        body { 
            font-family: Arial, sans-serif; 
            width: 250px; 
            padding: 10px; 
            color: #2D3B45; 
            line-height: 1.5; 
            margin: 0;
        }
        h3 { 
            margin-top: 0; 
            color: #008EE2; 
            border-bottom: 1px solid #eee;
            padding-bottom: 10px;
        }
        .highlight {
            background-color: #e6f2ff;
            padding: 8px;
            border-radius: 4px;
            border-left: 3px solid #008EE2;
        }
    </style>
</head>
<body>
    <h3>Canvas Quiz Importer</h3>
    <p>Tiện ích này chạy ngầm trực tiếp trên trang web Canvas.</p>
    <div class="highlight">
        <b>Cách sử dụng:</b><br>
        1. Đăng nhập vào Canvas.<br>
        2. Mở một <b>Khóa học (Course)</b> bất kỳ.<br>
        3. Nhìn xuống <b>góc dưới bên phải màn hình</b> trang web, bảng điều khiển upload CSV sẽ tự động xuất hiện ở đó.
    </div>
</body>
</html>
